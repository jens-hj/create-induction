plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.modrinth.minotaur' version '2.10.0'
}

java { withSourcesJar(); toolchain.languageVersion = JavaLanguageVersion.of(21) }
base { archivesName = 'create-induction' }
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'createmod'; url = 'https://maven.createmod.net' } }
        filter {
            includeGroup 'com.simibubi.create'
            includeGroupAndSubgroups 'net.createmod'
            includeGroup 'dev.engine-room.flywheel'
            includeGroup 'dev.engine-room.vanillin'
            includeGroup 'com.tterrag.registrate'
        }
    }
    exclusiveContent {
        forRepository { maven { name = 'ryanhcode'; url = 'https://maven.ryanhcode.dev/releases' } }
        filter {
            includeGroupAndSubgroups 'dev.ryanhcode'
            includeGroupAndSubgroups 'dev.simulated_team'
        }
    }
    exclusiveContent {
        forRepository { maven { name = 'blamejared'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'foundry.veil' }
    }
    exclusiveContent {
        forRepository { maven { name = 'modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    // Everything is compile-only: dev and test runs take the real jars from a modpack instance (-PpackMods).
    compileOnly("com.simibubi.create:create-${project.minecraft_version}:${project.create_version}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${project.ponder_version}+mc${project.minecraft_version}") { transitive = false }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${project.minecraft_version}:${project.flywheel_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${project.minecraft_version}:${project.sable_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${project.minecraft_version}:${project.sable_companion_version}") { transitive = false }
    compileOnly("foundry.veil:veil-neoforge-${project.minecraft_version}:${project.veil_version}") { transitive = false }
    compileOnly("dev.simulated_team.simulated:simulated-neoforge-${project.minecraft_version}:${project.simulated_version}") { transitive = false }
    // Optional integration: the coil as a native Power Grid source.
    compileOnly("maven.modrinth:power-grid:${project.powergrid_version}") { transitive = false }

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.joml:joml:${project.joml_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def showcaseDirectory = layout.buildDirectory.dir('run/showcase').get().asFile
def gameTestDirectory = layout.buildDirectory.dir('run/gameTest').get().asFile
// -PpackMods=<dir> symlinks the required mod jars (Create, Sable, Aeronautics, Power Grid) from a modpack instance.
def packMods = providers.gradleProperty('packMods')
def packModNames = providers.gradleProperty('packModNames').getOrElse(
    'create-1.21.1,sable-neoforge,create-aeronautics-bundled,powergrid,architectury')
neoForge {
    version = project.neo_version
    mods {
        create_induction { sourceSet sourceSets.main }
        create_induction_test { sourceSet sourceSets.testmod }
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.testmod
            gameDirectory = gameTestDirectory
            systemProperty 'neoforge.enabledGameTestNamespaces', 'create_induction'
        }
        // Gallery screenshots, see scripts/headless.py and src/testmod/.../Showcase.java
        showcase {
            client()
            sourceSet = sourceSets.testmod
            gameDirectory = showcaseDirectory
            programArguments.addAll('--width', '1920', '--height', '1080')
            systemProperty 'createinduction.showcase', layout.buildDirectory.dir('showcase').get().asFile.absolutePath
        }
    }
    runs.configureEach { jvmArgument '-Xmx4G' }
}

def prepareRun = { File directory ->
    directory.mkdirs()
    // Keep every graphical launch silent and free of first-run screens.
    def options = new File(directory, 'options.txt')
    def lines = options.exists() ? options.readLines().findAll {
        !(it.split(':', 2)[0] in ['soundCategory_master', 'soundCategory_music', 'onboardAccessibility',
                                  'narrator', 'pauseOnLostFocus', 'fullscreen', 'tutorialStep'])
    } : []
    options.text = (lines + ['soundCategory_master:0.0', 'soundCategory_music:0.0',
        'onboardAccessibility:false', 'narrator:0', 'pauseOnLostFocus:false', 'fullscreen:false',
        'tutorialStep:none']).join('\n') + '\n'
    def mods = new File(directory, 'mods'); mods.mkdirs()
    mods.listFiles().findAll { java.nio.file.Files.isSymbolicLink(it.toPath()) }.each { it.delete() }
    if (packMods.isPresent()) {
        def wanted = packModNames.split(',').findAll { it }
        new File(packMods.get()).listFiles().findAll { jar ->
            jar.name.endsWith('.jar') && !jar.name.startsWith('create-induction-') &&
                wanted.any { jar.name.startsWith(it) }
        }.each { source ->
            java.nio.file.Files.createSymbolicLink(new File(mods, source.name).toPath(), source.toPath().toRealPath())
        }
    }
}
tasks.named('runClient') { doFirst { prepareRun(file('run')) } }
tasks.named('runServer') { doFirst { prepareRun(file('run')) } }
tasks.named('runGameTestServer') {
    doFirst {
        prepareRun(gameTestDirectory)
        new File(gameTestDirectory, 'world').deleteDir()
    }
}
tasks.named('runShowcase') {
    doFirst {
        prepareRun(showcaseDirectory)
        new File(showcaseDirectory, 'saves/showcase').deleteDir()
        def options = new File(showcaseDirectory, 'options.txt')
        def keep = options.readLines().findAll { !(it.split(':', 2)[0] in ['renderDistance', 'simulationDistance', 'fov', 'renderClouds', 'graphicsMode', 'maxFps', 'bobView']) }
        options.text = (keep + ['renderDistance:8', 'simulationDistance:5', 'fov:-0.25', 'renderClouds:"false"', 'graphicsMode:1', 'maxFps:30', 'bobView:false']).join('\n') + '\n'
    }
}

test { useJUnitPlatform() }

tasks.withType(Jar).configureEach { from('LICENSE') }
def releaseVersion = project.version.toString()
processResources {
    inputs.property 'version', releaseVersion
    filesMatching('META-INF/neoforge.mods.toml') { expand version: releaseVersion }
}

def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN').orElse(
    providers.fileContents(layout.projectDirectory.file(
        "${System.getProperty('user.home')}/.config/modrinth-token")).asText.map { it.trim() })
def currentChangelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.map { text ->
    def section = text.split(/(?m)^## /).find { it.startsWith("${version}\n") || it.startsWith("${version}\r") }
    section ? section.substring(section.indexOf('\n') + 1).trim() : ''
}
modrinth {
    debugMode = providers.gradleProperty('modrinthDryRun').isPresent()
    token = modrinthToken
    projectId = 'create-induction'
    versionNumber = project.version.toString()
    versionName = "${project.version} (NeoForge ${project.minecraft_version})"
    versionType = 'release'
    uploadFile = jar
    additionalFiles { sourcesJar(tasks.named('sourcesJar')) }
    gameVersions = [project.minecraft_version]
    loaders = ['neoforge']
    changelog = currentChangelog
    environment = 'client_and_server'
    dependencies {
        required.project 'create'
        required.project 'sable'
        required.project 'create-aeronautics'
        optional.project 'power-grid'
    }
    syncBodyFrom = file('docs/MODRINTH.md').text
}
tasks.named('modrinth') { notCompatibleWithConfigurationCache('Minotaur reads Task.project') }
tasks.named('modrinthSyncBody') { notCompatibleWithConfigurationCache('Minotaur reads Task.project') }
